experiment_name: smoke
output_dir: results/smoke

data:
  root: data/smoke
  max_time_steps: 60

cv:
  n_splits: 3
  shuffle: true
  random_state: 42

models:
  - name: WDI-1NN
  - name: JAC-1NN
  - name: EAC-1NN
    params:
      attenuation: 0.01
  - name: MBW-LR
    params:
      C: 1.0
      max_iter: 2000
      random_state: 42
  - name: ACM-SVM
    params:
      C: 1.0
      kernel: rbf
      gamma: scale
      random_state: 42
  - name: CASIM
    params:
      n_kernels: 128
      random_state: 42
      use_sktime_if_available: false
